<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- Configuração mobile-first para iPhone SE (375x667) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Code Blocks - Programação Visual</title>
  <!-- Design System Modularizado -->
  <link rel="stylesheet" href="styles/variables.css" media="all">
  <link rel="stylesheet" href="styles/reset.css" media="all">
  <link rel="stylesheet" href="styles/base.css" media="all">
  <link rel="stylesheet" href="styles/layout.css" media="all">
  <link rel="stylesheet" href="styles/components.css" media="all">
  <link rel="stylesheet" href="styles/utilities.css" media="all">
</head>
<body>
  <!-- Container principal com layout de 3 colunas (Desktop) - Shell SPA -->
  <div class="appLayout">
    <!-- Barra superior gamificada (Header) - Renderizado via TopBar.js -->
    <header class="topBar" role="banner"></header>
    
    <!-- Sidebar (Biblioteca de blocos) - Renderizado via Sidebar.js -->
    <aside class="sidebar" aria-label="Biblioteca de blocos de comando"></aside>
    
    <!-- Workspace (Área de Drop) - Renderizado via Workspace.js -->
    <main class="workspaceArea" aria-label="Área de montagem de blocos" aria-dropeffect="none"></main>
    
    <!-- Stage (Palco de Execução) - Renderizado via Stage.js -->
    <section class="stageContainer" aria-label="Palco de execução do personagem"></section>
  </div>
  
  <!-- Script principal da aplicação (Módulo ES6+) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
